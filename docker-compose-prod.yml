name: hotkey-prod

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}"

  minio:
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"

  minio-init:
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"

  db-init:
    image: hotkey-server:prod
    environment:
      HOTKEY_ENV: production
      HOTKEY_DATABASE_URL: "postgres://hotkey:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/hotkey?sslmode=disable&connect_timeout=5"

  hotkey-server:
    image: hotkey-server:prod
    env_file:
      - .env.prod
    environment:
      HOTKEY_ENV: production
      HOTKEY_DATABASE_URL: "postgres://hotkey:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/hotkey?sslmode=disable&connect_timeout=5"
      HOTKEY_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      HOTKEY_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"
      HOTKEY_REFRESH_COOKIE_SECURE: "true"

  hotkey-web:
    image: hotkey-web:prod
    build:
      args:
        HOTKEY_DEPLOY_ENV: prod
    environment:
      HOTKEY_DEPLOY_ENV: prod
