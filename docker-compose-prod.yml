name: hotkey-prod

services:
  postgres:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-postgres"
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotkey
      POSTGRES_USER: hotkey
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotkey -d hotkey"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-redis"
    image: redis:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-minio"
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-minio-init"
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"
      HOTKEY_MINIO_BUCKET: "${HOTKEY_MINIO_BUCKET:-hotkey-evidence}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set hotkey http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "hotkey/$$HOTKEY_MINIO_BUCKET"

  db-init:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-db-init"
    image: hotkey-server:prod
    restart: "no"
    environment:
      HOTKEY_ENV: production
      HOTKEY_ROLE: all
      HOTKEY_DATABASE_URL: "postgres://hotkey:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/hotkey?sslmode=disable&connect_timeout=5"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /usr/local/bin/hotkey db verify ||
        /usr/local/bin/hotkey db init --empty-only --confirm-empty ||
          /usr/local/bin/hotkey db verify

  hotkey-agent:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-agent"
    image: hotkey-agent:prod
    build:
      context: ./agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOTKEY_AGENT_AUTH_TOKEN: "${HOTKEY_AGENT_AUTH_TOKEN:?set HOTKEY_AGENT_AUTH_TOKEN in .env.prod}"
      HOTKEY_AGENT_PREVIOUS_AUTH_TOKENS: "${HOTKEY_AGENT_PREVIOUS_AUTH_TOKENS:-}"
      HOTKEY_AGENT_RUNTIME: "${HOTKEY_AGENT_RUNTIME:-deterministic}"
      HOTKEY_AGENT_MAX_REQUEST_BYTES: "${HOTKEY_AGENT_MAX_REQUEST_BYTES:-262144}"
      HOTKEY_AGENT_MAX_CONCURRENCY: "${HOTKEY_AGENT_MAX_CONCURRENCY:-2}"
      HOTKEY_AGENT_MODEL_BASE_URL: "${HOTKEY_AGENT_MODEL_BASE_URL:-}"
      HOTKEY_AGENT_MODEL_API_KEY: "${HOTKEY_AGENT_MODEL_API_KEY:-}"
      HOTKEY_AGENT_MODEL_NAME: "${HOTKEY_AGENT_MODEL_NAME:-}"
      HOTKEY_AGENT_MODEL_VERSION: "${HOTKEY_AGENT_MODEL_VERSION:-}"
      HOTKEY_AGENT_MODEL_TIMEOUT_SECONDS: "${HOTKEY_AGENT_MODEL_TIMEOUT_SECONDS:-30}"
      HOTKEY_AGENT_MODEL_MAX_RESPONSE_BYTES: "${HOTKEY_AGENT_MODEL_MAX_RESPONSE_BYTES:-1048576}"
      HOTKEY_AGENT_MODEL_MAX_OUTPUT_TOKENS: "${HOTKEY_AGENT_MODEL_MAX_OUTPUT_TOKENS:-4096}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: "512m"
    cpus: "1.0"
    tmpfs:
      - /tmp:size=64m,mode=1777
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/readyz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  hotkey-server:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-api"
    image: hotkey-server:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      HOTKEY_ENV: production
      HOTKEY_ROLE: all
      HOTKEY_HTTP_ADDR: :8080
      HOTKEY_DATABASE_URL: "postgres://hotkey:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}@postgres:5432/hotkey?sslmode=disable&connect_timeout=5"
      HOTKEY_REDIS_URL: redis://redis:6379/0
      HOTKEY_MINIO_ENDPOINT: minio:9000
      HOTKEY_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.prod}"
      HOTKEY_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}"
      HOTKEY_MINIO_BUCKET: "${HOTKEY_MINIO_BUCKET:-hotkey-evidence}"
      HOTKEY_MINIO_USE_SSL: "false"
      HOTKEY_VAULT_PATH: /var/lib/hotkey/vault
      HOTKEY_CORS_ALLOWED_ORIGINS: "${HOTKEY_CORS_ALLOWED_ORIGINS:?set HOTKEY_CORS_ALLOWED_ORIGINS in .env.prod}"
      HOTKEY_REFRESH_COOKIE_SECURE: "true"
      HOTKEY_NOTIFICATION_POLL_INTERVAL: ${HOTKEY_NOTIFICATION_POLL_INTERVAL:-1s}
      HOTKEY_NOTIFICATION_HEARTBEAT_INTERVAL: ${HOTKEY_NOTIFICATION_HEARTBEAT_INTERVAL:-10s}
      HOTKEY_NOTIFICATION_MAX_CONNECTIONS: ${HOTKEY_NOTIFICATION_MAX_CONNECTIONS:-100}
      HOTKEY_AGENT_SHADOW_ENABLED: "${HOTKEY_AGENT_SHADOW_ENABLED:-false}"
      HOTKEY_AGENT_URL: http://hotkey-agent:8090
      HOTKEY_AGENT_AUTH_TOKEN: "${HOTKEY_AGENT_AUTH_TOKEN:?set HOTKEY_AGENT_AUTH_TOKEN in .env.prod}"
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${HOTKEY_HTTP_PORT:-8866}:8080"
    volumes:
      - vault_data:/var/lib/hotkey/vault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  hotkey-web:
    container_name: "${HOTKEY_CONTAINER_PREFIX:-hotkey-prod}-web"
    image: hotkey-web:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HOTKEY_API_ORIGIN: http://hotkey-server:8080
        HOTKEY_DEPLOY_ENV: prod
    restart: unless-stopped
    depends_on:
      hotkey-server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8010}:3000"
    environment:
      NODE_ENV: production
      HOTKEY_DEPLOY_ENV: prod
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
  vault_data:
