# Apply with: docker compose -f docker-compose.yml -f docker-compose-prod.yml ...
x-production: &production
  HOTKEY_ENVIRONMENT: production
  HOTKEY_DATABASE_URL: ${HOTKEY_DATABASE_URL:?Set a PostgreSQL psycopg URL}
  HOTKEY_BROKER_URL: ${HOTKEY_BROKER_URL:?Set an AMQP URL}
  HOTKEY_COOKIE_SECURE: "true"
  HOTKEY_ALLOWED_ORIGINS: ${HOTKEY_ALLOWED_ORIGINS:?Set a JSON array of exact HTTPS origins}
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
  rabbitmq:
    ports: !reset []
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set broker password}
  migrate:
    environment: *production
  backend:
    environment: *production
    ports: !reset []
  worker:
    environment: *production
  scheduler:
    environment: *production
  web:
    restart: unless-stopped
