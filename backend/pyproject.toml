[project]
name = "hotkey-backend"
version = "0.2.0"
description = "Personal learning: reliable social-media monitoring"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery>=5.5,<6",
  "argon2-cffi>=25.1,<26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<3", "httpx>=0.28,<1", "pip-audit>=2.7,<3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "TID252"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
explicit_package_bases = true
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --import-mode=importlib"
markers = ["integration: requires disposable PostgreSQL and RabbitMQ"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
