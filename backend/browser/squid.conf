# HotKey's browser-only egress. Add platform domains only with source admission,
# per-request accounting, and live redirect/subresource checks.
http_port 3128
visible_hostname hotkey-browser-egress

acl allowed_target dstdomain example.com
acl allowed_ports port 80 443
acl ssl_port port 443
acl connect method CONNECT
acl read_methods method GET HEAD CONNECT
acl ip_literal url_regex -i ^https?://[0-9]+(\.[0-9]+){3}([:/]|$)
acl ip_literal url_regex -i ^https?://\[
acl ip_literal url_regex -i ^[0-9]+(\.[0-9]+){3}:
acl ip_literal url_regex -i ^\[
acl blocked_destination dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8
acl blocked_destination dst 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24
acl blocked_destination dst 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16
acl blocked_destination dst 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_destination dst ::/128 ::1/128 64:ff9b:1::/48 100::/64
acl blocked_destination dst 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
acl docker_desktop_public dst 198.18.0.0/15

http_access deny ip_literal
http_access deny !allowed_ports
http_access deny connect !ssl_port
http_access deny !read_methods
http_access deny !allowed_target
# Docker Desktop maps public DNS to 198.18/15 alongside an IPv6 ULA. Limit
# this exception to the explicit canary host; other non-public targets fail.
http_access allow allowed_target docker_desktop_public
http_access deny blocked_destination
http_access allow allowed_target
http_access deny all

cache deny all
cache_mem 16 MB
pinger_enable off
access_log none
cache_log stdio:/dev/stderr
cache_store_log none
forwarded_for delete
pid_filename /tmp/squid.pid
coredump_dir /tmp
