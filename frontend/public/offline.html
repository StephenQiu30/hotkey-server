<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>HotKey · 暂时离线</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { width: min(34rem, calc(100% - 2rem)); border: 1px solid #e2e8f0; border-radius: 1rem; padding: 2rem; background: #fff; }
      h1 { margin: 0; font-size: 1.35rem; }
      p { margin: .75rem 0 0; line-height: 1.7; color: #475569; }
      button { margin-top: 1.25rem; min-height: 2.75rem; border: 0; border-radius: .7rem; padding: 0 1rem; color: #fff; background: #0f172a; font: inherit; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        body { background: #020617; color: #f8fafc; }
        main { border-color: #334155; background: #0f172a; }
        p { color: #cbd5e1; }
        button { color: #0f172a; background: #f8fafc; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前无法连接 HotKey</h1>
      <p>出于数据安全考虑，离线页面不会缓存或展示事件、正文、通知与登录信息。恢复网络后请重新加载。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
