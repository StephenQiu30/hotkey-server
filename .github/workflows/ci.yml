name: Test acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static-acceptance:
    name: Backend static acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: OpenAPI, vet, build and repository acceptance
        run: make ci-static

  backend-acceptance:
    name: Backend test acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hotkey_test
          POSTGRES_USER: hotkey
          POSTGRES_PASSWORD: hotkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotkey -d hotkey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HOTKEY_TEST_DSN: postgres://hotkey:hotkey@localhost:5432/hotkey_test?sslmode=disable
      HOTKEY_TEST_REDIS_URL: redis://127.0.0.1:6379/15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Database, schema and full test acceptance
        run: make ci-runtime

  backend-vulnerability-acceptance:
    name: Backend vulnerability acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Go dependency vulnerability acceptance
        run: make ci-vulnerability

  worker-recovery-acceptance:
    name: Worker recovery acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: hotkey_test
          POSTGRES_USER: hotkey
          POSTGRES_PASSWORD: hotkey
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotkey -d hotkey_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HOTKEY_TEST_DSN: postgres://hotkey:hotkey@localhost:5432/hotkey_test?sslmode=disable
      HOTKEY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      HOTKEY_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
      HOTKEY_TEST_MINIO_ACCESS_KEY: hotkeytest
      HOTKEY_TEST_MINIO_SECRET_KEY: hotkeytest-secret
      HOTKEY_TEST_MINIO_BUCKET: hotkey-worker-recovery
      HOTKEY_RECOVERY_MINIO_CONTAINER: hotkey-worker-recovery-${{ github.run_id }}
      HOTKEY_TEST_MINIO_ADMIN_ENDPOINT: http://hotkey-worker-recovery-${{ github.run_id }}:9000
      HOTKEY_TEST_MINIO_DOCKER_NETWORK: hotkey-worker-recovery-${{ github.run_id }}
      HOTKEY_JOINT_RECOVERY_ENVIRONMENT: github-actions-isolated-recovery
      HOTKEY_JOINT_RECOVERY_HARDWARE: ubuntu-latest-hosted-runner
      HOTKEY_JOINT_RECOVERY_GIT_REVISION: ${{ github.sha }}
      HOTKEY_JOINT_RECOVERY_PRODUCTION_EGRESS_DISABLED: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Start isolated MinIO
        run: |
          docker network create "$HOTKEY_TEST_MINIO_DOCKER_NETWORK"
          docker run --detach --rm --name "$HOTKEY_RECOVERY_MINIO_CONTAINER" \
            --network "$HOTKEY_TEST_MINIO_DOCKER_NETWORK" \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$HOTKEY_TEST_MINIO_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$HOTKEY_TEST_MINIO_SECRET_KEY" \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data --console-address :9001
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$HOTKEY_RECOVERY_MINIO_CONTAINER"
          exit 1

      - name: Four-point Worker recovery acceptance
        run: make worker-recovery-acceptance

      - name: Unified retention and rights-revocation rehearsal acceptance
        env:
          HOTKEY_RETENTION_REHEARSAL_OUTPUT: ${{ runner.temp }}/retention-rights-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}.json
          HOTKEY_RETENTION_REHEARSAL_ENVIRONMENT: github-actions-isolated-retention-rehearsal
          HOTKEY_RETENTION_REHEARSAL_HARDWARE: ubuntu-latest-hosted-runner
          HOTKEY_RETENTION_REHEARSAL_GIT_REVISION: ${{ github.sha }}
          HOTKEY_RETENTION_REHEARSAL_PRODUCTION_EGRESS_DISABLED: "true"
        run: make retention-rehearsal-acceptance

      - name: Upload sanitized retention and rights-revocation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retention-rights-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/retention-rights-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}.json

      - name: Synthetic credential rotation acceptance
        env:
          HOTKEY_SECRET_ROTATION_OUTPUT: ${{ runner.temp }}/secret-rotation-${{ github.run_id }}-${{ github.run_attempt }}.json
          HOTKEY_SECRET_ROTATION_ENVIRONMENT: github-actions-isolated-credential-rotation
          HOTKEY_SECRET_ROTATION_HARDWARE: ubuntu-latest-hosted-runner
          HOTKEY_SECRET_ROTATION_GIT_REVISION: ${{ github.sha }}
          HOTKEY_SECRET_ROTATION_PRODUCTION_EGRESS_DISABLED: "true"
        run: |
          make secret-rotation-core-acceptance
          go run ./test/tools/secret-rotation-report

      - name: Upload sanitized credential rotation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: secret-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/secret-rotation-${{ github.run_id }}-${{ github.run_attempt }}.json

      - name: M4 fault and projection recovery acceptance
        env:
          HOTKEY_M4_PROJECTION_RECOVERY_OUTPUT: ${{ runner.temp }}/m4-projection-recovery-${{ github.run_id }}-${{ github.run_attempt }}.json
          HOTKEY_M4_PROJECTION_RECOVERY_ENVIRONMENT: github-actions-independent-recovery-copy
          HOTKEY_M4_PROJECTION_RECOVERY_HARDWARE: ubuntu-latest-hosted-runner
          HOTKEY_M4_PROJECTION_RECOVERY_GIT_REVISION: ${{ github.sha }}
          HOTKEY_M4_PROJECTION_RECOVERY_PRODUCTION_EGRESS_DISABLED: "true"
        run: make m4-fault-recovery-acceptance

      - name: Upload sanitized M4 projection recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m4-projection-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/m4-projection-recovery-${{ github.run_id }}-${{ github.run_attempt }}.json

      - name: Joint PostgreSQL MinIO Vault and River recovery acceptance
        env:
          HOTKEY_JOINT_RECOVERY_OUTPUT: ${{ runner.temp }}/joint-recovery-${{ github.run_id }}.json
        run: make joint-recovery-acceptance

      - name: Remove isolated MinIO
        if: always()
        run: |
          docker rm --force "$HOTKEY_RECOVERY_MINIO_CONTAINER" || true
          docker network rm "$HOTKEY_TEST_MINIO_DOCKER_NETWORK" || true

  frontend-acceptance:
    name: Frontend test acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: OpenAPI client acceptance
        run: npm run openapi:check

      - name: TypeScript acceptance
        run: npm run typecheck

      - name: Unit test acceptance
        run: npm run test:unit

      - name: Production dependency vulnerability acceptance
        run: npm audit --omit=dev --audit-level=high

      - name: Production build acceptance
        run: npm run build

  agent-acceptance:
    name: Python Agent test acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: agent

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up locked Python and uv toolchain
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install locked Agent environment
        run: uv sync --all-extras --locked

      - name: Python format and lint acceptance
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Python type acceptance
        run: uv run mypy src

      - name: Python unit and contract acceptance
        run: uv run pytest

      - name: Python dependency vulnerability acceptance
        run: uv run pip-audit

  compose-acceptance:
    name: Compose configuration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare CI-only environment files
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/^HOTKEY_JWT_SECRET=.*/HOTKEY_JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef/' backend/.env
          sed -i 's/^HOTKEY_VERIFICATION_HMAC_SECRET=.*/HOTKEY_VERIFICATION_HMAC_SECRET=ci-verification-secret-0123456789abcdef0123456789abcdef/' backend/.env
          cp .env.prod.example .env.prod
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-postgres-password/' .env.prod
          sed -i 's/^MINIO_ROOT_USER=.*/MINIO_ROOT_USER=ci-minio/' .env.prod
          sed -i 's/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=ci-minio-password/' .env.prod
          sed -i 's/^HOTKEY_JWT_SECRET=.*/HOTKEY_JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef/' .env.prod
          sed -i 's/^HOTKEY_VERIFICATION_HMAC_SECRET=.*/HOTKEY_VERIFICATION_HMAC_SECRET=ci-verification-secret-0123456789abcdef0123456789abcdef/' .env.prod
          sed -i 's/^HOTKEY_AGENT_AUTH_TOKEN=.*/HOTKEY_AGENT_AUTH_TOKEN=ci-agent-secret-0123456789abcdef0123456789abcdef/' .env.prod
          sed -i 's|^HOTKEY_CORS_ALLOWED_ORIGINS=.*|HOTKEY_CORS_ALLOWED_ORIGINS=https://hotkey.example.test|' .env.prod

      - name: Development Compose acceptance
        run: docker compose -f docker-compose.yml config --quiet

      - name: Production Compose acceptance
        run: docker compose --env-file .env.prod -f docker-compose-prod.yml config --quiet

  browser-smoke-acceptance:
    name: Fresh-container browser business-flow acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HOTKEY_CONTAINER_PREFIX: hotkey-ci-${{ github.run_id }}
      HOTKEY_BROWSER_API_ORIGIN: http://127.0.0.1:8866
      HOTKEY_BROWSER_WEB_ORIGIN: http://127.0.0.1:8010
      HOTKEY_BROWSER_EMAIL: browser-e2e-sentinel@example.test
      HOTKEY_BROWSER_ANALYST_EMAIL: browser-empty-state@example.test
      HOTKEY_SECRET_ADMIN_EMAIL: browser-secret-admin@example.test
      HOTKEY_BROWSER_PASSWORD: BrowserFixture-Only-2026!
      HOTKEY_BROWSER_MONITOR_ID: 910001
      HOTKEY_BROWSER_RUN_ID: browser-${{ github.run_id }}-${{ github.run_attempt }}
      HOTKEY_BROWSER_FIXTURE_BODY: BrowserAcceptanceTopic2026 HOTKEY_BODY_SENTINEL_7f4b9c2a mail-list-one@example.test,mail-list-two@example.test /Users/hotkey-ci/private-vault/report.md
      HOTKEY_BROWSER_ARTIFACT_DIR: /tmp

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate masked synthetic secret canaries
        run: |
          cp backend/.env.example backend/.env
          node frontend/test/security/generate-secret-canaries.mjs "$GITHUB_ENV" backend/.env

      - name: Start a fresh container stack
        run: docker compose -p hotkey-ci -f docker-compose.yml up --build --detach --wait --wait-timeout 240

      - name: HTTP readiness and metrics smoke acceptance
        run: |
          curl --fail --silent http://127.0.0.1:8866/healthz
          curl --fail --silent http://127.0.0.1:8866/readyz
          curl --fail --silent http://127.0.0.1:8866/metrics | grep 'hotkey_runtime_metrics_collection_success'
          curl --fail --silent --show-error --head http://127.0.0.1:8010/ > /tmp/hotkey-web-headers.txt
          grep --fixed-strings --ignore-case 'content-security-policy:' /tmp/hotkey-web-headers.txt
          grep --fixed-strings "script-src-attr 'none'" /tmp/hotkey-web-headers.txt
          grep --fixed-strings "frame-ancestors 'none'" /tmp/hotkey-web-headers.txt

      - name: Prepare same-fixture report approval story
        run: |
          docker exec -i "$HOTKEY_CONTAINER_PREFIX-postgres" \
            psql -U hotkey -d hotkey -v fixture_run_id="$HOTKEY_BROWSER_RUN_ID" \
            < backend/test/fixtures/browser-acceptance/seed.sql
          node frontend/test/browser/prepare-business-flow.mjs > /tmp/hotkey-browser-fixture.json
          report_id="$(node -e "const value=require('/tmp/hotkey-browser-fixture.json'); if (!Number.isSafeInteger(value.reportID)) process.exit(1); process.stdout.write(String(value.reportID))")"
          docker exec -i "$HOTKEY_CONTAINER_PREFIX-postgres" \
            psql -U hotkey -d hotkey -v report_id="$report_id" -v fixture_body="$HOTKEY_BROWSER_FIXTURE_BODY" \
            < backend/test/fixtures/browser-acceptance/inject-sentinels.sql
          HOTKEY_BROWSER_REPORT_ID="$report_id" node frontend/test/browser/submit-business-flow.mjs \
            > /tmp/hotkey-browser-submitted.json
          echo "HOTKEY_BROWSER_REPORT_ID=$report_id" >> "$GITHUB_ENV"

      - name: Exercise credential and HTTP error surfaces
        run: node frontend/test/security/exercise-secret-surfaces.mjs

      - name: Install browser acceptance runtime
        run: |
          npm install --global agent-browser@0.33.2
          agent-browser install --with-deps

      - name: Real browser notification to PostgreSQL search acceptance
        env:
          AGENT_BROWSER_SESSION: hotkey-ci
        run: |
          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/login"
          agent-browser cookies clear
          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/login"
          agent-browser wait --load networkidle
          agent-browser network requests --clear
          agent-browser errors --clear
          agent-browser find label "邮箱" fill "$HOTKEY_BROWSER_EMAIL"
          agent-browser find label "密码" fill "$HOTKEY_BROWSER_PASSWORD"
          agent-browser find role button click --name "进入工作台" --exact
          agent-browser wait --url '**/dashboard*'

          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/dashboard/notifications"
          agent-browser wait --text "日报等待审批"
          agent-browser find role link click --name "查看通知关联内容" --exact
          agent-browser wait --url '**/dashboard/reports?report=*'
          agent-browser wait --text "批准并冻结"
          agent-browser find role button click --name "批准并冻结" --exact
          agent-browser wait --text "已冻结"
          agent-browser wait --fn "Array.from(document.querySelectorAll('button')).every((button) => !button.disabled && Number.parseFloat(getComputedStyle(button).opacity) >= 0.99)"
          agent-browser a11y --tags wcag2a,wcag2aa --json > /tmp/hotkey-a11y-reports.json

          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/dashboard/reports?report=919007"
          agent-browser wait --text "BrowserXSSFixture"
          agent-browser wait --text "globalThis.__HOTKEY_XSS__=true"
          agent-browser eval --json "globalThis.__HOTKEY_XSS__ !== true && document.querySelector('iframe,object,embed,svg[onload],[onload],[onerror]') === null && Array.from(document.scripts).every((script) => !script.textContent.includes('globalThis.__HOTKEY_XSS__=true')) && Array.from(document.querySelectorAll('a')).every((link) => !/^javascript:/i.test(link.getAttribute('href') || '')) && document.querySelector('[aria-label=\"日报 919007\"]')?.textContent.includes('<script>') === true" > /tmp/hotkey-browser-content-security.json
          agent-browser a11y --tags wcag2a,wcag2aa --json > /tmp/hotkey-a11y-report-content-security.json

          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/dashboard/knowledge"
          agent-browser wait --text "批准提案"
          agent-browser find role button click --name "批准提案" --exact
          agent-browser wait --text "已批准"
          agent-browser find role button click --name "原子发布到 Vault" --exact
          agent-browser wait --text "已应用"
          agent-browser wait --text "已同步"
          agent-browser a11y --tags wcag2a,wcag2aa --json > /tmp/hotkey-a11y-knowledge.json

          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/dashboard/search"
          agent-browser wait --text "全文检索"
          agent-browser find label "搜索词" fill "BrowserAcceptanceTopic2026"
          agent-browser click 'main form button[type="submit"]'
          agent-browser wait --text "日报 #$HOTKEY_BROWSER_REPORT_ID"
          agent-browser wait --text "BrowserAcceptanceTopic2026"
          agent-browser wait 300
          agent-browser a11y --tags wcag2a,wcag2aa --json > /tmp/hotkey-a11y-search-desktop.json

          agent-browser set viewport 390 844
          agent-browser press Tab
          agent-browser eval --json "document.querySelector('main') !== null && document.documentElement.scrollWidth <= window.innerWidth && document.activeElement !== document.body" > /tmp/hotkey-browser-viewport.json
          agent-browser wait 300
          agent-browser a11y --tags wcag2a,wcag2aa --json > /tmp/hotkey-a11y-search-mobile.json

          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/login"
          agent-browser wait --text "进入工作台"
          agent-browser find label "邮箱" fill "$HOTKEY_BROWSER_ANALYST_EMAIL"
          agent-browser find label "密码" fill "$HOTKEY_BROWSER_PASSWORD"
          agent-browser find role button click --name "进入工作台" --exact
          agent-browser wait --url '**/dashboard*'
          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/dashboard/notifications"
          agent-browser wait --text "暂时没有站内通知"
          agent-browser a11y --tags wcag2a,wcag2aa --json > /tmp/hotkey-a11y-notifications-empty.json
          agent-browser open "$HOTKEY_BROWSER_WEB_ORIGIN/dashboard/knowledge"
          agent-browser wait --text "权限不足"
          agent-browser a11y --tags wcag2a,wcag2aa --json > /tmp/hotkey-a11y-knowledge-permission.json

          agent-browser errors --json > /tmp/hotkey-browser-errors.json
          agent-browser network requests --json > /tmp/hotkey-browser-network.json
          node frontend/test/browser/verify-artifacts.mjs

      - name: Verify database and Vault closure
        run: |
          docker exec -i "$HOTKEY_CONTAINER_PREFIX-postgres" \
            psql -qAt -U hotkey -d hotkey \
            < backend/test/fixtures/browser-acceptance/assert-business-flow.sql \
            > /tmp/hotkey-browser-database.json
          docker exec "$HOTKEY_CONTAINER_PREFIX-api" \
            test -f "/var/lib/hotkey/vault/reports/report-$HOTKEY_BROWSER_REPORT_ID.md"

      - name: Measure fixed-environment M4 business-flow capacity
        env:
          HOTKEY_M4_CAPACITY_RUN_ID: m4-capacity-${{ github.run_id }}-${{ github.run_attempt }}
          HOTKEY_M4_CAPACITY_ENVIRONMENT: github-actions-fresh-container
          HOTKEY_M4_CAPACITY_GIT_REVISION: ${{ github.sha }}
          HOTKEY_M4_CAPACITY_CONFIRM_ISOLATED: "true"
          HOTKEY_M4_CAPACITY_PRODUCTION_EGRESS_DISABLED: "true"
          HOTKEY_M4_CAPACITY_WARMUPS: "2"
          HOTKEY_M4_CAPACITY_SAMPLES: "12"
          HOTKEY_M4_CAPACITY_INTER_FLOW_INTERVAL_MILLIS: "31000"
          HOTKEY_M4_CAPACITY_OUTPUT: /tmp/hotkey-m4-capacity.json
          HOTKEY_M4_CAPACITY_BODY_SENTINEL: HOTKEY_BODY_SENTINEL_7f4b9c2a
          HOTKEY_M4_CAPACITY_EMAIL_SENTINEL: mail-list-one@example.test
          HOTKEY_M4_CAPACITY_HOST_PATH_SENTINEL: /Users/hotkey-ci/private-vault/report.md
        run: |
          logical_cpus="$(getconf _NPROCESSORS_ONLN)"
          memory_kib="$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)"
          export HOTKEY_M4_CAPACITY_HARDWARE="GitHub hosted ubuntu-latest; ${logical_cpus} logical CPU; ${memory_kib} KiB RAM; Docker loopback"
          node frontend/test/browser/measure-business-flow-capacity.mjs

      - name: Verify leak-sentinel closure after every business-flow request
        run: |
          docker compose -p hotkey-ci -f docker-compose.yml logs --no-color \
            > /tmp/hotkey-container-logs.txt
          node frontend/test/browser/verify-no-sentinel-leak.mjs /tmp/hotkey-container-logs.txt

      - name: Export database secret surfaces
        run: |
          docker exec -i "$HOTKEY_CONTAINER_PREFIX-postgres" \
            psql -qAt -U hotkey -d hotkey \
            < backend/test/fixtures/browser-acceptance/export-secret-surfaces.sql \
            > /tmp/hotkey-secret-database-surfaces.txt

      - name: Copy frontend and Vault delivery surfaces
        run: |
          mkdir -p /tmp/hotkey-frontend-runtime /tmp/hotkey-acceptance-attachments
          docker cp "$HOTKEY_CONTAINER_PREFIX-web":/app/server.js /tmp/hotkey-frontend-runtime/server.js
          docker cp "$HOTKEY_CONTAINER_PREFIX-web":/app/.next /tmp/hotkey-frontend-runtime/.next
          docker cp "$HOTKEY_CONTAINER_PREFIX-web":/app/public /tmp/hotkey-frontend-runtime/public
          docker cp "$HOTKEY_CONTAINER_PREFIX-api":"/var/lib/hotkey/vault/reports/report-$HOTKEY_BROWSER_REPORT_ID.md" \
            /tmp/hotkey-vault-delivery.md
          cp /tmp/hotkey-browser-acceptance.json \
            /tmp/hotkey-browser-database.json \
            /tmp/hotkey-browser-network-summary.json \
            /tmp/hotkey-browser-content-security.json \
            /tmp/hotkey-m4-capacity.json \
            /tmp/hotkey-sentinel-scan.json \
            /tmp/hotkey-a11y-*.json \
            /tmp/hotkey-acceptance-attachments/

      - name: Scan synthetic secrets across outbound surfaces
        run: node frontend/test/security/verify-secret-surfaces.mjs

      - name: Upload sanitized browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-business-flow-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            /tmp/hotkey-browser-acceptance.json
            /tmp/hotkey-browser-database.json
            /tmp/hotkey-browser-network-summary.json
            /tmp/hotkey-browser-content-security.json
            /tmp/hotkey-m4-capacity.json
            /tmp/hotkey-sentinel-scan.json
            /tmp/hotkey-secret-surface-scan.json
            /tmp/hotkey-a11y-*.json

      - name: Close browser session
        if: always()
        run: agent-browser --session hotkey-ci close || true

      - name: Print container diagnostics
        if: failure()
        run: docker compose -p hotkey-ci -f docker-compose.yml ps

      - name: Remove fresh container stack
        if: always()
        run: docker compose -p hotkey-ci -f docker-compose.yml down --volumes --remove-orphans

  all-acceptance:
    name: All acceptance gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [backend-static-acceptance, backend-acceptance, backend-vulnerability-acceptance, worker-recovery-acceptance, frontend-acceptance, agent-acceptance, compose-acceptance, browser-smoke-acceptance]

    steps:
      - name: Verify every required acceptance gate
        run: |
          test "${{ needs.backend-static-acceptance.result }}" = "success"
          test "${{ needs.backend-acceptance.result }}" = "success"
          test "${{ needs.backend-vulnerability-acceptance.result }}" = "success"
          test "${{ needs.worker-recovery-acceptance.result }}" = "success"
          test "${{ needs.frontend-acceptance.result }}" = "success"
          test "${{ needs.agent-acceptance.result }}" = "success"
          test "${{ needs.compose-acceptance.result }}" = "success"
          test "${{ needs.browser-smoke-acceptance.result }}" = "success"
