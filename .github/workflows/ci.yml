name: Python and workspace
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_DB: hotkey_test
          POSTGRES_USER: hotkey
          POSTGRES_PASSWORD: learning
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hotkey -d hotkey_test" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-management
        env:
          RABBITMQ_DEFAULT_USER: hotkey
          RABBITMQ_DEFAULT_PASS: learning
          RABBITMQ_DEFAULT_VHOST: hotkey_test
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      HOTKEY_TEST_DATABASE_URL: postgresql+psycopg://hotkey:learning@127.0.0.1:5432/hotkey_test
      HOTKEY_TEST_BROKER_URL: amqp://hotkey:learning@127.0.0.1:5672/hotkey_test
      COMPOSE_PROJECT_NAME: hotkey-ci
      HOTKEY_E2E_USERNAME: learner
      HOTKEY_E2E_PASSWORD: CI-only-synthetic-password-2026
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend --locked
      - run: uv run --project backend ruff format --check backend && uv run --project backend ruff check backend
      - run: uv run --directory backend mypy
      - run: uv run --project backend pytest backend/tests -q
      - run: uv run --project backend pip-audit
      - run: uv run --directory backend/src python -m tools.export_openapi --check
      - run: npm ci --prefix frontend
      - run: npm run check:contract --prefix frontend && npm run format:check --prefix frontend && npm run lint --prefix frontend && npm run typecheck --prefix frontend && npm run build --prefix frontend
      - run: npm audit --prefix frontend --omit=dev --audit-level=high
      - run: docker compose config --quiet
      - run: docker compose --env-file .env.env.example -p hotkey-ci-env -f docker-compose.yml -f docker-compose-env.yml config --quiet
      - run: docker compose --env-file .env.prod.example -p hotkey-ci-prod -f docker-compose.yml -f docker-compose-prod.yml config --quiet
      - run: docker compose up -d --build
      - run: uv run --project backend python backend/scripts/verify_compose.py
      - run: uv run --project backend python backend/scripts/verify_proxy_replacement.py
      - run: |
          python - <<'PY'
          import os, subprocess
          subprocess.run(['docker','compose','exec','-T','backend','python','-m','cli','owner-init',os.environ['HOTKEY_E2E_USERNAME'],'--password-stdin'], input=os.environ['HOTKEY_E2E_PASSWORD'] + chr(10), text=True, check=True)
          PY
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
      - run: uv run --project backend python backend/scripts/verify_backup_restore.py
        env:
          HOTKEY_BACKUP_POC_DATABASE_URL: postgresql+psycopg://hotkey:learning@127.0.0.1:15435/hotkey
          PYTHONPATH: backend/src
      - run: uv run --project backend python backend/scripts/verify_old_application_rollback.py
        env:
          HOTKEY_ROLLBACK_POC_DATABASE_URL: postgresql+psycopg://hotkey:learning@127.0.0.1:15435/hotkey
      - run: uv run --project backend python backend/scripts/verify_shutdown.py
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: frontend/test-results
      - if: always()
        run: docker compose down --volumes
