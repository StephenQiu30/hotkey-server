name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_DB: hotkey_test
          POSTGRES_PASSWORD: identity_test_only
          POSTGRES_USER: hotkey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotkey_test -d hotkey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      kafka:
        image: apache/kafka:4.1.2
        env:
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_NODE_ID: "1"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_LOG_DIRS: /var/lib/kafka/data
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    env:
      HOTKEY_TEST_DATABASE_URL: postgresql+psycopg://hotkey_test:identity_test_only@127.0.0.1:5432/hotkey_test
      HOTKEY_TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      HOTKEY_TEST_MINIO_ENDPOINT: 127.0.0.1:9000
      HOTKEY_TEST_MINIO_ACCESS_KEY: hotkey_test
      HOTKEY_TEST_MINIO_SECRET_KEY: hotkey_minio_test_only
      HOTKEY_TEST_MINIO_BUCKET: hotkey-test-evidence
      HOTKEY_TEST_MINIO_SECURE: "false"
      MINIO_ROOT_USER: hotkey_test
      MINIO_ROOT_PASSWORD: hotkey_minio_test_only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24.8"
          cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Build pinned MinIO test server from official source
        run: go install -v github.com/minio/minio@RELEASE.2025-10-15T17-29-55Z

      - name: Start isolated MinIO for integration tests
        shell: bash
        run: |
          minio_data_dir="$RUNNER_TEMP/hotkey-minio-data"
          minio_log_path="$RUNNER_TEMP/hotkey-minio.log"
          mkdir -p "$minio_data_dir"
          "$(go env GOPATH)/bin/minio" server "$minio_data_dir" \
            --address 127.0.0.1:9000 \
            --console-address 127.0.0.1:9001 \
            >"$minio_log_path" 2>&1 &
          minio_pid=$!
          printf 'HOTKEY_CI_MINIO_PID=%s\n' "$minio_pid" >> "$GITHUB_ENV"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$minio_log_path"
          exit 1

      - name: Create isolated MinIO test bucket
        run: >-
          uv run --no-sync python -c
          'import os; from minio import Minio; client = Minio(os.environ["HOTKEY_TEST_MINIO_ENDPOINT"], access_key=os.environ["HOTKEY_TEST_MINIO_ACCESS_KEY"], secret_key=os.environ["HOTKEY_TEST_MINIO_SECRET_KEY"], secure=False); client.make_bucket(os.environ["HOTKEY_TEST_MINIO_BUCKET"])'

      - name: Initialize the isolated PostgreSQL schema
        run: docker exec -i ${{ job.services.postgres.id }} psql -X --set ON_ERROR_STOP=on --username hotkey_test --dbname hotkey_test < database/schema.sql

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest

      - name: Stop isolated MinIO
        if: always()
        shell: bash
        run: |
          if [[ -n "${HOTKEY_CI_MINIO_PID:-}" ]]; then
            kill "$HOTKEY_CI_MINIO_PID" 2>/dev/null || true
          fi
