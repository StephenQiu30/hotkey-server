name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_DB: hotkey_test
          POSTGRES_PASSWORD: identity_test_only
          POSTGRES_USER: hotkey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotkey_test -d hotkey_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HOTKEY_TEST_DATABASE_URL: postgresql+psycopg://hotkey_test:identity_test_only@127.0.0.1:5432/hotkey_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Initialize the isolated PostgreSQL schema
        run: docker exec -i ${{ job.services.postgres.id }} psql -X --set ON_ERROR_STOP=on --username hotkey_test --dbname hotkey_test < database/schema.sql

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest
