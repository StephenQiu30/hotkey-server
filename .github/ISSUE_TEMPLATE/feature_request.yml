name: 功能建议
description: 提议符合当前项目范围的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "先查看 BACKLOG 与 docs/README.md，确认建议是否已在计划中。"
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述实际使用场景和目前的障碍。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 如涉及新来源，请说明公开或授权方式、能力范围、限流与失败状态。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 如何验证
      description: 描述能够观察到的结果和必要的真实环境验证。
