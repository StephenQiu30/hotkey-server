name: 缺陷报告
description: 报告可复现的服务端、Web 或文档问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请先查阅 README 和 BACKLOG。不要在公开 Issue 中填写 Token、Cookie、真实用户内容或漏洞细节；安全问题请阅读 SECURITY.md。"
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 后端或任务执行
        - Web 工作台
        - 文档或配置
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 提供最小、已脱敏的复现过程。
      placeholder: "1. 启动...\n2. 打开...\n3. 执行..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 请填写提交号、操作系统、部署方式及相关版本，勿粘贴环境变量值。
    validations:
      required: true
