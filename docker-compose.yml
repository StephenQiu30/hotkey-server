name: hotkey-server

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotkey
      POSTGRES_USER: hotkey
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-hotkey}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotkey -d hotkey"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-hotkey}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-me}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-hotkey}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-me}"
      HOTKEY_MINIO_BUCKET: "${HOTKEY_MINIO_BUCKET:-hotkey-evidence}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set hotkey http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "hotkey/$$HOTKEY_MINIO_BUCKET"

  db-init:
    image: hotkey-server:env
    restart: "no"
    environment:
      HOTKEY_ENV: development
      HOTKEY_ROLE: all
      HOTKEY_DATABASE_URL: "postgres://hotkey:${POSTGRES_PASSWORD:-hotkey}@postgres:5432/hotkey?sslmode=disable&connect_timeout=5"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /usr/local/bin/hotkey db verify ||
          /usr/local/bin/hotkey db init --empty-only --confirm-empty ||
          /usr/local/bin/hotkey db verify

  hotkey-server:
    image: hotkey-server:env
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      HOTKEY_ENV: development
      HOTKEY_ROLE: all
      HOTKEY_HTTP_ADDR: :8080
      HOTKEY_DATABASE_URL: "postgres://hotkey:${POSTGRES_PASSWORD:-hotkey}@postgres:5432/hotkey?sslmode=disable&connect_timeout=5"
      HOTKEY_REDIS_URL: redis://redis:6379/0
      HOTKEY_MINIO_ENDPOINT: minio:9000
      HOTKEY_MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-hotkey}"
      HOTKEY_MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-change-me}"
      HOTKEY_MINIO_BUCKET: "${HOTKEY_MINIO_BUCKET:-hotkey-evidence}"
      HOTKEY_MINIO_USE_SSL: "false"
      HOTKEY_VAULT_PATH: /var/lib/hotkey/vault
      HOTKEY_CORS_ALLOWED_ORIGINS: "${HOTKEY_CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
      HOTKEY_REFRESH_COOKIE_SECURE: "false"
      HOTKEY_NOTIFICATION_POLL_INTERVAL: ${HOTKEY_NOTIFICATION_POLL_INTERVAL:-1s}
      HOTKEY_NOTIFICATION_HEARTBEAT_INTERVAL: ${HOTKEY_NOTIFICATION_HEARTBEAT_INTERVAL:-10s}
      HOTKEY_NOTIFICATION_MAX_CONNECTIONS: ${HOTKEY_NOTIFICATION_MAX_CONNECTIONS:-100}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${HOTKEY_HTTP_PORT:-8080}:8080"
    volumes:
      - vault_data:/var/lib/hotkey/vault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  hotkey-web:
    image: hotkey-web:env
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        HOTKEY_API_ORIGIN: http://hotkey-server:8080
        HOTKEY_DEPLOY_ENV: env
    restart: unless-stopped
    depends_on:
      hotkey-server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOTKEY_DEPLOY_ENV: env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  minio_data:
  vault_data:
