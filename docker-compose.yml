name: hotkey
x-app: &app
  image: hotkey-backend:local
  build: ./backend
  init: true
  restart: unless-stopped
  stop_grace_period: 45s
  extra_hosts: ["host.docker.internal:host-gateway"]
  environment: &environment
    HOTKEY_DATABASE_URL: postgresql+psycopg://hotkey:learning@postgres:5432/hotkey
    HOTKEY_BROKER_URL: amqp://hotkey:learning@rabbitmq:5672/hotkey
    HOTKEY_ALLOWED_ORIGINS: '["http://localhost:8010","http://127.0.0.1:8010"]'
    HOTKEY_S3_ENDPOINT: ${HOTKEY_S3_ENDPOINT:-}
    HOTKEY_S3_ACCESS_KEY: ${HOTKEY_S3_ACCESS_KEY:-}
    HOTKEY_S3_SECRET_KEY: ${HOTKEY_S3_SECRET_KEY:-}
    HOTKEY_S3_BUCKET: ${HOTKEY_S3_BUCKET:-}
    HOTKEY_S3_SECURE: ${HOTKEY_S3_SECURE:-true}
    HOTKEY_SOURCE_RIGHTS_ALLOWED: ${HOTKEY_SOURCE_RIGHTS_ALLOWED:-[]}
    HOTKEY_SOURCE_PIPELINES_CONNECTED: ${HOTKEY_SOURCE_PIPELINES_CONNECTED:-[]}
    HOTKEY_EMBEDDING_BASE_URL: ${HOTKEY_EMBEDDING_BASE_URL:-}
    HOTKEY_EMBEDDING_MODEL: ${HOTKEY_EMBEDDING_MODEL:-qwen3-embedding:latest}
    HOTKEY_EMBEDDING_MODEL_DIGEST: ${HOTKEY_EMBEDDING_MODEL_DIGEST:-}
    HOTKEY_EMBEDDING_DIMENSIONS: ${HOTKEY_EMBEDDING_DIMENSIONS:-1024}
    HOTKEY_EMBEDDING_TIMEOUT_SECONDS: ${HOTKEY_EMBEDDING_TIMEOUT_SECONDS:-15}
  depends_on:
    migrate: {condition: service_completed_successfully}
    rabbitmq: {condition: service_healthy}
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: hotkey
      POSTGRES_USER: hotkey
      POSTGRES_PASSWORD: learning
    ports: ["127.0.0.1:${HOTKEY_DB_PORT:-15435}:5432"]
    volumes: ["database_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hotkey -d hotkey"]
      interval: 3s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: hotkey
      RABBITMQ_DEFAULT_PASS: learning
      RABBITMQ_DEFAULT_VHOST: hotkey
    ports: ["127.0.0.1:${HOTKEY_AMQP_PORT:-15673}:5672"]
    volumes: ["queue_data:/var/lib/rabbitmq"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    image: hotkey-backend:local
    build: ./backend
    environment: *environment
    command: [python, -m, cli, migrate]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    <<: *app
    command: [uvicorn, main:create_app, --factory, --host, 0.0.0.0, --port, "8080", --no-access-log]
    ports: ["127.0.0.1:${HOTKEY_BACKEND_PORT:-8867}:8080"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready',timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: [celery, -A, worker.app:app, worker, --loglevel=WARNING, --pool=prefork, --concurrency=2]
  scheduler:
    <<: *app
    command: [python, -m, cli, scheduler]
  web:
    build: ./frontend
    ports: ["127.0.0.1:${HOTKEY_WEB_PORT:-8010}:8080"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  database_data:
  queue_data:
